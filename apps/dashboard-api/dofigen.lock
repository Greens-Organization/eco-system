effective: |
  builders:
    build:
      fromBuilder: deps
      workdir: /app/apps/dashboard-api
      copy:
      - paths:
        - .
        target: /app/
      run:
      - bun build --compile src/server.ts --outfile=dashboard-api
    deps:
      fromImage:
        path: oven/bun
        digest: sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
      workdir: /app/
      run:
      - bun install --frozen-lockfile --production --filter @app/dashboard-api
      cache:
      - target: /root/.bun/install/cache
      bind:
      - target: bunfig.toml
        source: bunfig.toml
      - target: bun.lock
        source: bun.lock
      - target: package.json
        source: package.json
      - target: apps/dashboard/package.json
        source: apps/dashboard/package.json
      - target: apps/dashboard-api/package.json
        source: apps/dashboard-api/package.json
      - target: packages/auth/package.json
        source: packages/auth/package.json
      - target: packages/cache/package.json
        source: packages/cache/package.json
      - target: packages/db/package.json
        source: packages/db/package.json
      - target: packages/design-system/package.json
        source: packages/design-system/package.json
      - target: packages/email/package.json
        source: packages/email/package.json
      - target: packages/i18n/package.json
        source: packages/i18n/package.json
      - target: packages/observability/package.json
        source: packages/observability/package.json
      - target: packages/seo/package.json
        source: packages/seo/package.json
      - target: packages/storage/package.json
        source: packages/storage/package.json
      - target: packages/testing/package.json
        source: packages/testing/package.json
      - target: packages/tools/package.json
        source: packages/tools/package.json
      - target: packages/tsconfig/package.json
        source: packages/tsconfig/package.json
  fromImage:
    path: oven/bun
    digest: sha256:14a223fa35747ec728bce300ef85888bc5f7958164d15bbba6a54b22b52a3288
  user:
    user: '1000'
  workdir: /home/bun/app
  copy:
  - fromBuilder: build
    paths:
    - /app/apps/dashboard-api/dashboard-api
    target: /home/bun/app/dashboard-api
  entrypoint:
  - /home/bun/app/dashboard-api
  expose:
  - port: 3002
  healthcheck:
    cmd: 'bun -e ''fetch("http://localhost:3002/status").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'''
    interval: 30s
    timeout: 10s
    start: 30s
    retries: 3
images:
  registry.hub.docker.com:443:
    oven:
      bun:
        1.4.3-slim:
          digest: sha256:14a223fa35747ec728bce300ef85888bc5f7958164d15bbba6a54b22b52a3288
        1.4.3:
          digest: sha256:ec06c3b6cea04192ae6770c434f668ca41d343ad19fa6472216c7b48be39c598
resources:
  dofigen.yml:
    hash: 74467e596fba03d8078c3f07971c0fa50a65b57e107198632da30e3f4e7f4fe3
    content: |
      # Build from the repo root: docker build -f apps/dashboard-api/Dockerfile .
      # The root .dockerignore applies (no node_modules, no .env files).
      # After editing: `dofigen update` (pins image digests), then `dofigen generate`.

      builders:
        # Dependencies only, from the lockfile: changes to source code keep this
        # layer cached. Every workspace manifest is bound because Bun resolves the
        # whole workspace, even when it installs one member's tree.
        deps:
          fromImage: oven/bun:1.4.3
          workdir: /app/
          labels:
            org.opencontainers.image.stage: deps
          bind:
            - bunfig.toml
            - bun.lock
            - package.json
            - apps/dashboard/package.json
            - apps/dashboard-api/package.json
            - packages/auth/package.json
            - packages/cache/package.json
            - packages/db/package.json
            - packages/design-system/package.json
            - packages/email/package.json
            - packages/i18n/package.json
            - packages/observability/package.json
            - packages/seo/package.json
            - packages/storage/package.json
            - packages/testing/package.json
            - packages/tools/package.json
            - packages/tsconfig/package.json
          run: bun install --frozen-lockfile --production --filter @app/dashboard-api
          cache:
            - /root/.bun/install/cache

        build:
          fromBuilder: deps
          workdir: /app/apps/dashboard-api
          labels:
            org.opencontainers.image.stage: build
          copy:
            - . /app/
          run: bun build --compile src/server.ts --outfile=dashboard-api

      fromImage: oven/bun:1.4.3-slim

      labels:
        org.opencontainers.image.title: Eco System API
        org.opencontainers.image.description: Hono API behind the eco-system dashboard (internal network only)
        org.opencontainers.image.vendor: Eco System

      user: "1000"
      workdir: /home/bun/app

      copy:
        - fromBuilder: build
          source: /app/apps/dashboard-api/dashboard-api
          target: /home/bun/app/dashboard-api

      expose: "3002"

      healthcheck:
        interval: 30s
        timeout: 10s
        start: 30s
        retries: 3
        cmd: "bun -e 'fetch(\"http://localhost:3002/status\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"

      entrypoint: /home/bun/app/dashboard-api
