# whether to enable telemetry
telemetry = false

[run]
# Force bun runtime for all scripts (replaces node shebang with bun)
bun = true

[install]

linker = "isolated"

# use isolated installs to prevent duplicate dependencies. See more in https://bun.com/docs/install/isolated
# publicHoistPattern = []

# whether to install optionalDependencies
optional = true

# whether to install devDependencies
dev = true

# whether to install peerDependencies
peer = true

# equivalent to `--production` flag
production = false

# equivalent to `--frozen-lockfile` flag
frozenLockfile = false

# equivalent to `--dry-run` flag
dryRun = false

# equivalent to 'save-exact=true' on .npmrc
exact = true

# NOTE: bun test does not walk up to a parent bunfig from a sub-package cwd, so a
# root [test].preload would not apply to `turbo test` (which runs `bun test` per
# package). Each package wires the shared preload in its own test script instead:
#   "test": "bun test --preload @pack/testing/preload"   (consumers)
#   "test": "bun test --preload ./preload.ts"             (the @pack/testing package)
