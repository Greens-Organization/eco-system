name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same tools as local development, from mise.toml: bun runs everything;
      # node is there only because the dashboard's production build
      # (adapter-node) runs on it.
      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      # TypeScript via the root tsconfig references; .svelte files need svelte-check.
      - run: bun check
      - run: bunx turbo run check:svelte build
      # Each workspace's bunfig.toml holds a per-file coverage floor.
      - run: bun run test:coverage

  e2e:
    name: API e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      # Brings up infra/docker/docker-compose.test.yml, migrates, runs, tears down.
      - run: bun run test:e2e

  browser:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # Browsers are keyed by the Playwright version, which bun.lock pins.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/dashboard
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/dashboard
        run: bunx playwright install-deps chromium

      # Test compose + API + the dashboard's production build, then Playwright.
      - run: bun run test:browser

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7
