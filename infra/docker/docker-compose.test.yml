# Postgres e Redis efêmeros pros testes e2e do apps/dashboard-api. Sem persistência — some
# no `down`. Portas 5436 e 6380 pra não colidir com o dev (5432, 6379).
# Subidos/derrubados pelo runner `apps/dashboard-api/test/e2e/run.ts`.
name: eco-api-test

services:
  pg-test:
    image: postgres:18-alpine
    container_name: eco-api-pg-test
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: eco_user
      POSTGRES_PASSWORD: eco_password
      POSTGRES_DB: eco_test
      PGDATA: /var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eco_user -d eco_test']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  redis-test:
    image: redis:7-alpine
    container_name: eco-api-redis-test
    ports:
      - '6380:6379'
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
