# Local observability stack for dev — Grafana LGTM all-in-one.
# Receives OTLP (traces/metrics/logs) and exposes Grafana to visualize them.
# Production stays agnostic (point OTEL_EXPORTER_OTLP_ENDPOINT at your own).
#
# Up:      bun run docker:obs:up
# Grafana: http://localhost:3000  (anonymous login, no password by default)
# In .env: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: eco-system-lgtm
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm-grafana:/data/grafana
      - lgtm-prometheus:/data/prometheus
      - lgtm-loki:/loki
    restart: unless-stopped

volumes:
  lgtm-grafana:
  lgtm-prometheus:
  lgtm-loki:
